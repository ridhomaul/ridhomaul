<svg width="900" height="270" viewBox="0 0 900 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ridho Maulana — Full-Stack Web Developer (Laravel &amp; Next.js)">
  <title>Ridho Maulana — Full-Stack Web Developer</title>
  <style>
    .font-display {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .font-sans {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 0.75; }
      70% { transform: scale(2.1); opacity: 0; }
      100% { transform: scale(2.1); opacity: 0; }
    }
    .pulse-ring {
      transform-origin: 702px 46px;
      animation: pulse-ring 2.4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
  </style>

  <defs>
    <pattern id="dot-grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d4d3ce" opacity="0.95" />
    </pattern>
    <linearGradient id="bg-grad-light" x1="0" y1="0" x2="900" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#fcfcfb" />
      <stop offset="100%" stop-color="#f6f5f2" />
    </linearGradient>
    <linearGradient id="fade-mask-light" x1="560" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>
    <mask id="grid-mask-light">
      <rect x="520" y="0" width="380" height="270" fill="url(#fade-mask-light)" />
    </mask>
    <clipPath id="card-clip-light">
      <rect x="1" y="1" width="898" height="268" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip-light)">
    <!-- Base surface -->
    <rect x="0" y="0" width="900" height="270" fill="url(#bg-grad-light)" />

    <!-- Subtle editorial dot grid on the right -->
    <rect x="520" y="0" width="380" height="270" fill="url(#dot-grid-light)" mask="url(#grid-mask-light)" />

    <!-- Subtle architectural diagonal accent -->
    <line x1="650" y1="0" x2="900" y2="250" stroke="#e8e7e4" stroke-width="1" opacity="0.9" />
    <line x1="720" y1="0" x2="900" y2="180" stroke="#e8e7e4" stroke-width="1" opacity="0.6" />

    <!-- Top bar: Monogram + Handle -->
    <rect x="38" y="30" width="34" height="34" rx="8" fill="#17171a" />
    <text x="55" y="52" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700" letter-spacing="-0.02em" class="font-display">RM</text>
    <text x="84" y="51" fill="#6a6a72" font-size="13" font-weight="500" class="font-mono">@ridhomaul</text>

    <!-- Status Pill (Top Right) -->
    <rect x="684" y="31" width="178" height="30" rx="15" fill="#ffffff" stroke="#e8e7e4" stroke-width="1" />
    <circle cx="702" cy="46" r="4" fill="#16a34a" class="pulse-ring" />
    <circle cx="702" cy="46" r="3.5" fill="#16a34a" />
    <text x="714" y="50" fill="#17171a" font-size="11.5" font-weight="500" class="font-sans">Open to work · Jakarta</text>

    <!-- Hero Title & Role -->
    <text x="38" y="124" fill="#17171a" font-size="42" font-weight="700" letter-spacing="-0.035em" class="font-display">Ridho Maulana</text>
    <text x="38" y="156" font-size="17" class="font-sans"><tspan fill="#17171a" font-weight="600">Full-Stack Web Developer</tspan><tspan dx="8" fill="#a8a8b0" font-weight="400">—</tspan><tspan dx="8" fill="#6a6a72" font-weight="500">Laravel &amp; Next.js</tspan></text>

    <!-- Supporting editorial bio line -->
    <text x="38" y="187" fill="#6a6a72" font-size="13.5" font-weight="400" class="font-sans">Building PostgreSQL-backed platforms · 2+ yrs leading digital media production (2,000+ pieces shipped)</text>

    <!-- Hairline divider -->
    <line x1="38" y1="212" x2="862" y2="212" stroke="#e8e7e4" stroke-width="1" />

    <!-- Bottom Stack Pills -->
    <g class="font-mono" font-size="11" font-weight="500">
      <rect x="38" y="226" width="66" height="24" rx="6" fill="#ffffff" stroke="#e2e1dd" />
      <text x="71" y="242" text-anchor="middle" fill="#3f3f46">Laravel</text>

      <rect x="112" y="226" width="66" height="24" rx="6" fill="#ffffff" stroke="#e2e1dd" />
      <text x="145" y="242" text-anchor="middle" fill="#3f3f46">Next.js</text>

      <rect x="186" y="226" width="84" height="24" rx="6" fill="#ffffff" stroke="#e2e1dd" />
      <text x="228" y="242" text-anchor="middle" fill="#3f3f46">TypeScript</text>

      <rect x="278" y="226" width="86" height="24" rx="6" fill="#ffffff" stroke="#e2e1dd" />
      <text x="321" y="242" text-anchor="middle" fill="#3f3f46">PostgreSQL</text>

      <rect x="372" y="226" width="74" height="24" rx="6" fill="#ffffff" stroke="#e2e1dd" />
      <text x="409" y="242" text-anchor="middle" fill="#3f3f46">Supabase</text>

      <rect x="454" y="226" width="60" height="24" rx="6" fill="#ffffff" stroke="#e2e1dd" />
      <text x="484" y="242" text-anchor="middle" fill="#3f3f46">Docker</text>
    </g>

    <!-- Portfolio domain stamp -->
    <text x="862" y="242" text-anchor="end" fill="#6a6a72" font-size="11.5" font-weight="500" class="font-mono">maulanaridho.netlify.app ↗</text>
  </g>

  <!-- Outer Card Border -->
  <rect x="0.75" y="0.75" width="898.5" height="268.5" rx="16" stroke="#e8e7e4" stroke-width="1.5" />
</svg>
