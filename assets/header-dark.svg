<svg width="900" height="196" viewBox="0 0 900 196" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ridho Maulana — Full Stack Developer">
  <title>Ridho Maulana — Full Stack Developer</title>
  <style>
    .font-display {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .font-sans {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 0.75; }
      70% { transform: scale(2.1); opacity: 0; }
      100% { transform: scale(2.1); opacity: 0; }
    }
    .pulse-ring {
      transform-origin: 702px 47px;
      animation: pulse-ring 2.4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
  </style>

  <defs>
    <pattern id="dot-grid-dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2a2a2e" opacity="0.85" />
    </pattern>
    <linearGradient id="bg-grad-dark" x1="0" y1="0" x2="900" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="65%" stop-color="#121212" />
      <stop offset="100%" stop-color="#1a1a1c" />
    </linearGradient>
    <linearGradient id="fade-mask-dark" x1="560" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>
    <mask id="grid-mask-dark">
      <rect x="520" y="0" width="380" height="196" fill="url(#fade-mask-dark)" />
    </mask>
    <clipPath id="card-clip-dark">
      <rect x="1" y="1" width="898" height="194" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip-dark)">
    <!-- Base surface -->
    <rect x="0" y="0" width="900" height="196" fill="url(#bg-grad-dark)" />

    <!-- Subtle editorial dot grid on the right -->
    <rect x="520" y="0" width="380" height="196" fill="url(#dot-grid-dark)" mask="url(#grid-mask-dark)" />

    <!-- Subtle architectural diagonal accent -->
    <line x1="704" y1="0" x2="900" y2="196" stroke="#2a2a2e" stroke-width="1" opacity="0.55" />
    <line x1="764" y1="0" x2="900" y2="136" stroke="#2a2a2e" stroke-width="1" opacity="0.35" />

    <!-- Top bar: Monogram + Handle -->
    <rect x="38" y="30" width="34" height="34" rx="8" fill="#1a1a1c" stroke="#2f2f35" stroke-width="1.2" />
    <text x="55" y="52" text-anchor="middle" fill="#edecea" font-size="13" font-weight="700" letter-spacing="-0.02em" class="font-display">RM</text>
    <text x="84" y="51" fill="#85858e" font-size="13" font-weight="500" class="font-mono">@ridhomaul</text>

    <!-- Status Pill (Top Right) -->
    <rect x="684" y="32" width="178" height="30" rx="15" fill="#1a1a1c" stroke="#2a2a2e" stroke-width="1" />
    <circle cx="702" cy="47" r="4" fill="#22c55e" class="pulse-ring" />
    <circle cx="702" cy="47" r="3.5" fill="#22c55e" />
    <text x="714" y="51" fill="#edecea" font-size="11.5" font-weight="500" class="font-sans">Open to work · Jakarta</text>

    <!-- Hero Title & Role -->
    <text x="38" y="130" fill="#edecea" font-size="44" font-weight="700" letter-spacing="-0.035em" class="font-display">Ridho Maulana</text>
    <text x="38" y="162" fill="#a8a8b0" font-size="18" font-weight="500" class="font-sans">Full Stack Developer</text>
  </g>

  <!-- Outer Card Border -->
  <rect x="0.75" y="0.75" width="898.5" height="194.5" rx="16" stroke="#2a2a2e" stroke-width="1.5" />
</svg>
